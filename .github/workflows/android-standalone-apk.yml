name: Android standalone APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Activate Yarn 3.6.4
        run: |
          if ! command -v corepack >/dev/null 2>&1; then
            npm install --global corepack@0.36.0
          fi
          test "$(corepack yarn --version)" = "3.6.4"
          mkdir -p "$RUNNER_TEMP/xnero-yarn-bin"
          cat > "$RUNNER_TEMP/xnero-yarn-bin/yarn" <<'EOF'
          #!/usr/bin/env bash
          exec corepack yarn "$@"
          EOF
          chmod +x "$RUNNER_TEMP/xnero-yarn-bin/yarn"
          printf '%s\n' "$RUNNER_TEMP/xnero-yarn-bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: corepack yarn install --immutable

      - name: Install exact Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Create temporary build environment
        run: |
          cat > .env <<'EOF'
          DEBUG_KEYSTORE_ANDROID_PASSWORD=android
          DEFAULT_HARMONY_BASE_URI=https://harmony.invalid
          DEFAULT_GROUNDCONTROL_BASE_URI=https://groundcontrol.invalid
          WALLETCONNECT_PROJECT_ID=local-debug-placeholder
          EOF

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair -noprompt -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build standalone APK with embedded JavaScript bundle
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify embedded JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          echo "Embedded bundle present:"
          unzip -l "$APK" | grep 'assets/index.android.bundle'

      - uses: actions/upload-artifact@v4
        with:
          name: xnero-app-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
